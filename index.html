<html>
  <head>
    <title>webparts-anniversary-countdown by toritan</title>
    <!-- google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- jquery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- script -->
    <script type="text/javascript">
      // #region init *******************************************************
      // カウントダウンの日付を設定
      const timezone = "+09";
      const targetDate = "2026-01-01T00:00:00";

      // タイマー保存用
      let interval;
      // 設定保存用
      let settings = {};

      // 設定初期化・読み込み
      const lsSettings = localStorage.getItem(
        "webparts-anniversary-countdown-toritan-settings",
        "settings"
      );

      if (lsSettings) {
        const ls = JSON.parse(lsSettings);
        settings.targetDate = new Date(ls.targetDate);
        settings.updateFrequency = ls.updateFrequency;
      } else {
        // 初期設定
        settings = {
          targetDate: new Date(`${targetDate}${timezone}:00`),
          updateFrequency: "200",
        };
      }
      // #endregion init

      // #region method *****************************************************
      // 対象日付までの秒数を取得
      const getCountdownSeconds = () => {
        const sec =
          Math.floor(
            (settings.targetDate.getTime() - new Date().getTime()) / 1000
          ) + 1;
        return sec;
      };

      // Date型を日本語カレンダーに変換
      const getJapaneseDate = (date) => {
        return `${date.getFullYear()}年${
          date.getMonth() + 1
        }月${date.getDate()}日 ${date.getHours()}時${date.getMinutes()}分${date.getSeconds()}秒 まで`.replace(
          "0時0分0秒 ",
          ""
        );
      };

      // ターゲット表示
      const showTarget = (target) => {
        $("#target-text").text(getJapaneseDate(target));
      };

      // カウントダウン描画
      const setContdownDiv = (digits) => {
        // 数字を整形
        const filledText = digits
          .toString()
          .replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1,")
          .padStart(10)
          .split("");
        for (let i = 0; i < filledText.length; i++) {
          const digitId = `num${i}`;
          const number = filledText[i];
          const digitNumId =
            digitId + (number === " " ? "S" : number === "," ? "C" : number);
          const isChange = $(`#${digitNumId}`).length === 0;

          if (isChange) {
            // 古い数字
            const fadeTarget = $(`#${digitId} > *`);
            $(fadeTarget).addClass("pre-hide");

            setTimeout(() => {
              $(fadeTarget).remove();
            }, 1000);

            // 新しい数字
            $(`#${digitId}`).append(
              `<div id="${digitNumId}" class="pre-show"><div class="outline">${number}</div><div class="main">${number}</div><div>`
            );
            if (number === " ") {
              $(`#${digitId}`).addClass("space");
            } else {
              $(`#${digitId}`).removeClass("space");
            }
            $(`#${digitNumId}`)
              .delay(100)
              .queue(function () {
                $(this).removeClass("pre-show");
              });
          }
        }
      };

      // カウントダウンを表示
      const showCountdown = () => {
        const sec = getCountdownSeconds();
        if (sec < -60) {
          // 1分以上過ぎた場合は、次のタイマーを来年にセット
          settings.targetDate.setFullYear(
            settings.targetDate.getFullYear() + 1
          );
          showTarget(settings.targetDate);
          return;
        }
        if (sec <= 0) {
          // カウントダウン終了
          $("#countdown").hide();
          $("#aniversary").show();
          return;
        } else {
          $("#countdown").show();
          $("#aniversary").hide();
        }

        setContdownDiv(sec);
      };

      // 設定ダイアログを開く
      const openDialog = () => {
        // タイムゾーンを変換してセット
        const targetDate = new Date(
          settings.targetDate.getTime() + timezone * 60 * 60 * 1000
        );
        const hoge = settings.targetDate.get;
        $("#target-date").val(targetDate.toISOString().slice(0, 16));
        $("#update-frequency").val(settings.updateFrequency);
        $("#setting").removeClass("d-none");
      };
      // 設定ダイアログを閉じる
      const cancelDialog = () => {
        $("#setting").addClass("d-none");
      };
      // 設定ダイアログを保存する
      const submitDialog = () => {
        if ($("#target-date").val()) {
          const targetDate = `${$("#target-date").val()}${timezone}:00`;
          settings.targetDate = new Date(targetDate);
          showTarget(settings.targetDate);
        }

        const updateFrequency = $("#update-frequency").val();
        settings.updateFrequency = updateFrequency;

        // LS保存
        localStorage.setItem(
          "webparts-anniversary-countdown-toritan-settings",
          JSON.stringify(settings)
        );

        // タイマーリセット
        clearInterval(interval);
        interval = setInterval(showCountdown, settings.updateFrequency);

        $("#setting").addClass("d-none");
      };
      // #endregion methon

      // #region ready ******************************************************
      $().ready(function () {
        // ターゲット表示
        showTarget(settings.targetDate);
        // カウント・ダウン表示
        showCountdown();
        // タイマーセット
        interval = setInterval(showCountdown, settings.updateFrequency);
      });
      // #endregion ready
    </script>
    <style type="text/css">
      /* #region css main ************************************************ */
      html {
        --background-color: 0, 255, 0;
        --background-opacity: 1;
        --text-color: 255, 255, 255;
        --text-outline-color: 0, 0, 0;
        --target-text-color: var(--text-outline-color);
        --target-background-color: var(--text-color);
      }
      body {
        font-family: "M PLUS 1", monospace;
        font-optical-sizing: auto;
        font-weight: 900;
        font-style: normal;
        background-color: rgba(
          var(--background-color),
          var(--background-opacity)
        );
        user-select: none;
        transform: scale(2);
        transform-origin: left top;
      }
      /* #endregion css main */

      /* #region css target ********************************************** */
      #target {
        display: inline-block;
        font-size: 2em;
        border-radius: 1em;
        color: rgb(var(--target-text-color));
        background-color: rgb(var(--target-background-color));
        margin-bottom: -1em;
        padding: 0 1em 0 0.5em;
      }
      #target #menu {
        cursor: pointer;
      }
      /* #endregion css target */

      /* #region css countdown ******************************************* */
      #countdown {
        font-size: 0;
        margin-left: 4rem;
      }
      #countdown .digit {
        font-size: 8rem;
        display: inline-block;
        position: relative;
        width: 0.66em;
        overflow: visible;
        transition: all 0.3s ease-in-out;
      }
      #countdown .digit.comma {
        width: 0.4em;
      }
      #countdown .digit.space {
        width: 1px;
      }
      #countdown .digit div {
        position: absolute;
        top: 0;
        left: 0;
      }
      #countdown #unit.digit {
        top: 1.1em;
      }
      #countdown .digit > div {
        transition: all 0.2s ease-in-out;
        transform: scale(1);
        opacity: 1;
      }
      #countdown .digit > div.pre-show {
        transform: scale(1.2);
        translate: 0 -0.4em;
        opacity: 0;
      }
      #countdown .digit > div.pre-hide {
        transition-delay: 0.1s;
        transform: scale(0.8);
        translate: 0 0.4em;
        opacity: 0;
      }
      #countdown .outline {
        -webkit-text-stroke: 0.2em rgb(var(--text-outline-color));
      }
      #countdown .main {
        color: rgb(var(--text-color));
      }
      #countdown #unit {
        font-size: 4rem;
        margin-left: 0.2em;
      }
      /* #endregion css countdown */

      /* #region css aniversary ****************************************** */
      #aniversary {
        font-size: 0;
        margin-left: 50px;
      }
      #aniversary > div {
        font-size: 8rem;
        display: inline-block;
        position: relative;
      }
      #aniversary > div .outline {
        width: 0.66em;
        -webkit-text-stroke: 0.2em rgb(var(--text-outline-color));
      }
      #aniversary > div .main {
        color: rgb(var(--text-color));
        position: absolute;
        top: 0;
        left: 0;
      }
      #aniversary > div {
        animation: floating-y 0.5s ease-in-out infinite alternate-reverse;
      }
      @keyframes floating-y {
        0% {
          transform: translateY(-10%);
        }
        100% {
          transform: translateY(10%);
        }
      }
      #aniversary > div#aniv1 {
        animation-delay: -1200ms;
        width: 0.7em;
      }
      #aniversary > div#aniv2 {
        animation-delay: -1100ms;
        width: 0.55em;
      }
      #aniversary > div#aniv3 {
        animation-delay: -1000ms;
        width: 0.55em;
      }
      #aniversary > div#aniv4 {
        animation-delay: -900ms;
        width: 0.35em;
      }
      #aniversary > div#aniv5 {
        animation-delay: -800ms;
        width: 0.55em;
      }
      #aniversary > div#aniv6 {
        animation-delay: -700ms;
        width: 0.55em;
      }
      #aniversary > div#aniv7 {
        animation-delay: -600ms;
        width: 0.45em;
      }
      #aniversary > div#aniv8 {
        animation-delay: -500ms;
        width: 0.5em;
      }
      #aniversary > div#aniv9 {
        animation-delay: -400ms;
        width: 0.6em;
      }
      #aniversary > div#aniva {
        animation-delay: -300ms;
        width: 0.5em;
      }
      #aniversary > div#anivb {
        animation-delay: -200ms;
        width: 0.5em;
      }
      #aniversary > div#anivc {
        animation-delay: -100ms;
        width: 0.3em;
      }
      #aniversary > div#anivd {
        animation-delay: 0ms;
        width: 0.3em;
      }
      /* #endregion css aniversary */

      /* #region css setting ********************************************* */
      #setting {
        position: absolute;
        top: 2em;
        left: 3em;
        background-color: white;
        transform: scale(1.5);
        transform-origin: left top;
        border-radius: 0.5em;
        border: 0.1em solid black;
        transition: all 0.2s ease-in-out;
        opacity: 1;
        translate: 0 0;
      }
      #setting.d-none {
        opacity: 0;
        translate: 0 1em;
        pointer-events: none;
      }
      #setting > div {
        margin: 0.2em 0;
        padding: 0 0.5em;
      }
      #setting > div.actions {
        border-top: 0.05em solid grey;
        margin-top: 0.5em;
        padding: 0.5em 0.5em;
        display: flex;
        justify-content: space-between;
      }
      /* #endregion css setting */
    </style>
  </head>
  <body>
    <div>
      <div id="target">
        <span id="menu" onclick="openDialog()">🕒️</span>
        <span id="target-text"></span>
      </div>
      <div id="countdown">
        <div id="num0" class="digit"></div>
        <div id="num1" class="digit"></div>
        <div id="num2" class="digit comma"></div>
        <div id="num3" class="digit"></div>
        <div id="num4" class="digit"></div>
        <div id="num5" class="digit"></div>
        <div id="num6" class="digit comma"></div>
        <div id="num7" class="digit"></div>
        <div id="num8" class="digit"></div>
        <div id="num9" class="digit"></div>
        <div id="unit" class="digit">
          <div class="outline">秒</div>
          <div class="main">秒</div>
        </div>
      </div>
      <div id="aniversary" style="display: none">
        <div id="aniv1">
          <div class="outline">A</div>
          <div class="main">A</div>
        </div>
        <div id="aniv2">
          <div class="outline">n</div>
          <div class="main">n</div>
        </div>
        <div id="aniv3">
          <div class="outline">n</div>
          <div class="main">n</div>
        </div>
        <div id="aniv4">
          <div class="outline">i</div>
          <div class="main">i</div>
        </div>
        <div id="aniv5">
          <div class="outline">v</div>
          <div class="main">v</div>
        </div>
        <div id="aniv6">
          <div class="outline">e</div>
          <div class="main">e</div>
        </div>
        <div id="aniv7">
          <div class="outline">r</div>
          <div class="main">r</div>
        </div>
        <div id="aniv8">
          <div class="outline">s</div>
          <div class="main">s</div>
        </div>
        <div id="aniv9">
          <div class="outline">a</div>
          <div class="main">a</div>
        </div>
        <div id="aniva">
          <div class="outline">r</div>
          <div class="main">r</div>
        </div>
        <div id="anivb">
          <div class="outline">y</div>
          <div class="main">y</div>
        </div>
        <div id="anivc">
          <div class="outline">!</div>
          <div class="main">!</div>
        </div>
        <div id="anivd">
          <div class="outline">!</div>
          <div class="main">!</div>
        </div>
      </div>
    </div>
    <div id="setting" class="d-none">
      <div>対象日時：<input type="datetime-local" id="target-date" /></div>
      <div>
        更新間隔：<select id="update-frequency">
          <option value="100">100ms</option>
          <option value="200">200ms</option>
          <option value="500">500ms</option>
          <option value="1000">1000ms</option>
        </select>
      </div>
      <div class="actions">
        <button onclick="cancelDialog()">キャンセル</button>
        <button onclick="submitDialog()">保存</button>
      </div>
    </div>
  </body>
</html>
